// Gradle init script written by apexpacks (corporate profile).
// Replaces ALL repository declarations with the Artifactory mirror.
def artUser = System.getenv("ARTI_USER") ?: ""
def artPassword = System.getenv("ARTI_PASSWORD") ?: ""
def mirrorUrl = "{{GRADLE_MIRROR_URL}}"

def applyMirror = { RepositoryHandler repos ->
    repos.clear()
    repos.maven {
        url mirrorUrl
        if (artUser) { credentials { username artUser; password artPassword } }
        allowInsecureProtocol = mirrorUrl.startsWith("http://")
    }
}

settingsEvaluated { settings ->
    applyMirror(settings.pluginManagement.repositories)
    if (settings.metaClass.respondsTo(settings, 'getDependencyResolutionManagement')) {
        try {
            settings.dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
                applyMirror(repositories)
            }
        } catch (ignored) {}
    }
}

allprojects {
    buildscript {
        applyMirror(repositories)
    }
    afterEvaluate {
        applyMirror(repositories)
    }
}
