image:
  # nginx serves the static files.
  #
  # "nginx" is a virtual name in Wolfi, provided by both nginx-stable and
  # nginx-mainline — apk picks whichever has the higher provider version, so the
  # image could swing between branches on a Wolfi refresh. Pin the branch.
  # nginx-stable-config pulls in mime.types, which /etc/nginx/apexpack.conf
  # includes; without it nginx refuses to start.
  packages:
    - nginx-stable
    - nginx-stable-config
    - ca-certificates-bundle=20260413-r0
  entrypoint: nginx
  # Wolfi's stock /etc/nginx/nginx.conf has no conf.d/http.d include, listens on
  # 80 (unbindable as uid 65532) and roots at the prefix /var/lib/nginx/html.
  # The webserver hook writes a complete config instead; -c loads it.
  # -e is required because nginx opens its compile-time default error log
  # (/var/lib/nginx/logs/error.log) before it parses any config.
  cmd:
    - "-c"
    - "/etc/nginx/apexpack.conf"
    - "-e"
    - "/dev/stderr"
    - "-g"
    - "daemon off;"
  run-as: 65532
  ports:
    - "8080"
  env:
    NGINX_PORT: "8080"
  health-check:
    http:
      path: /
      port: 8080
    interval: 30s
    timeout: 5s
    start-period: 10s
    retries: 3

scan:
  auto-patch: false
  patch-persist: false

test:
  packages:
    - busybox
    - nginx-stable
    - nginx-stable-config
  pipeline:
    - runs: |
        nginx -v 2>&1
        echo "✓ nginx is installed"
    # melange runs this pipeline as root. Before nginx accepts any config it
    # resolves its compile-time default user and group ("nginx") through
    # getpwnam/getgrnam, and neither account exists in the test environment —
    # so -t dies with getpwnam("nginx") failed after reporting the syntax ok.
    #
    # The runtime image never reaches that code: it runs as uid 65532, and
    # nginx only looks the accounts up when euid is 0. These entries exist
    # purely so -t can get past the lookup and actually load the config.
    - runs: |
        grep -q '^nginx:' /etc/passwd || \
          echo 'nginx:x:65533:65533:nginx:/nonexistent:/sbin/nologin' >> /etc/passwd
        grep -q '^nginx:' /etc/group || echo 'nginx:x:65533:' >> /etc/group
        echo "✓ test-only nginx account present"
    # Parses the config apexpack actually ships and loads every include, so a
    # missing mime.types or a bad project nginx.conf fails the build rather than
    # the pod. -e keeps the prefix-relative default error log out of the way.
    #
    # On failure the config is dumped with line numbers. nginx reports a parse
    # error as "<file>:<line>" and nothing else, and the config is assembled at
    # build time from the project's own nginx.conf — so without the dump the log
    # names a line nobody can look up.
    - runs: |
        if ! nginx -t -c /etc/nginx/apexpack.conf -e /dev/stderr; then
          echo "--- nginx config as shipped (numbered) ---" >&2
          for f in /etc/nginx/apexpack.conf /etc/nginx/conf.d/*.conf; do
            [ -f "$f" ] || continue
            echo "=== $f ===" >&2
            cat -n "$f" >&2
          done
          echo "--- end nginx config ---" >&2
          exit 1
        fi
        echo "✓ /etc/nginx/apexpack.conf parses"
    # Last line of defence for a project config apexpack rewrote: the image runs
    # read-only as uid 65532, so nothing writable may sit outside /tmp and no
    # listener may use a privileged port. Checks the fragment too, not just the
    # main config.
    - runs: |
        fail=0
        for f in /etc/nginx/apexpack.conf /etc/nginx/conf.d/*.conf; do
          [ -f "$f" ] || continue
          if grep -nE '^[[:space:]]*(pid|proxy_cache_path|[a-z_]*_temp_path)[[:space:]]+/' "$f" \
               | grep -vE '[[:space:]]/tmp/'; then
            echo "✗ $f: writable path outside /tmp" >&2
            fail=1
          fi
          if grep -nE '^[[:space:]]*listen[[:space:]]+([^;]*:)?(80|443)[[:space:];]' "$f"; then
            echo "✗ $f: privileged listen port - uid 65532 cannot bind it" >&2
            fail=1
          fi
          if grep -nE '^[[:space:]]*user[[:space:]]' "$f"; then
            echo "✗ $f: active user directive - ignored at runtime, fatal to nginx -t as root" >&2
            fail=1
          fi
        done
        [ "$fail" -eq 0 ] || exit 1
        echo "✓ writable paths under /tmp, no privileged ports, no user directive"
    # The check above only sees a directive that is written down. nginx falls back
    # to its compiled-in default for any *_temp_path the config omits, and on Wolfi
    # those are absolute under /var/lib/nginx/tmp - read-only at runtime. nginx
    # creates all of them in ngx_create_paths at startup whether the feature is
    # used or not, so a plain static site still needs a uwsgi temp dir. An omitted
    # directive is therefore exactly as fatal as a wrong one, and invisible to a
    # value check - which is how a broken image shipped. Only the main config is
    # checked: a conf.d fragment is included inside http{} and inherits these.
    - runs: |
        missing=""
        for d in client_body_temp_path proxy_temp_path fastcgi_temp_path uwsgi_temp_path scgi_temp_path; do
          grep -qE "^[[:space:]]*$d[[:space:]]" /etc/nginx/apexpack.conf || missing="$missing $d"
        done
        if [ -n "$missing" ]; then
          echo "x /etc/nginx/apexpack.conf omits:$missing" >&2
          echo "  nginx falls back to /var/lib/nginx/tmp for these and creates them at" >&2
          echo "  startup, so the pod dies on a read-only root filesystem with" >&2
          echo "  mkdir() /var/lib/nginx/tmp/uwsgi failed (30: Read-only file system)" >&2
          exit 1
        fi
        echo "OK: all five nginx temp paths are declared"
