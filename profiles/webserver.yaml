        # dist/<project>/browser, and an outDir can nest it further still (dist/build).
        # A hardcoded guess either fails outright or ships a tree whose index.html sits a
        # level down, which nginx then answers with 404 from an image that built
        # perfectly cleanly. Take the shallowest candidate that holds an index.html.
        _out=""
        for _c in dist build out dist/* build/* out/* dist/*/* build/*/*; do
