# Webserver / Static site profile
# Detects: index.html (plain static), or SPA build markers (vite.config.*, angular.json)
# Supports: Plain HTML, React/Vue/Svelte SPA (Vite, CRA), Angular, Hugo, Jekyll
# Runtime image: Wolfi + nginx (serves static files)

runtime: webserver
version: "1"
description: Static site or SPA served by nginx (React, Vue, Angular, plain HTML)

detect:
  files:
    - index.html
    - vite.config.ts
    - vite.config.js
    - angular.json
    - hugo.toml
    - hugo.yaml
    - _config.yml
  content:
    - file: nginx.conf
      contains: "server"
      boost-confidence: 0.20
    - file: package.json
      contains: "\"@angular/core\""
      boost-confidence: 0.05
      framework: angular
    - file: package.json
      contains: "\"vite\""
      boost-confidence: 0.05
      framework: vite
    - file: package.json
      contains: "\"react\""
      boost-confidence: 0.03
      framework: react
    - file: package.json
      contains: "\"vue\""
      boost-confidence: 0.03
      framework: vue
    - file: package.json
      contains: "\"svelte\""
      boost-confidence: 0.03
      framework: svelte
    - file: hugo.toml
      contains: "baseURL"
      boost-confidence: 0.05
      framework: hugo
    - file: hugo.yaml
      contains: "baseURL"
      boost-confidence: 0.05
      framework: hugo
  # Lower base confidence — webserver is a fallback when no language is detected.
  confidence: 0.70

build:
  # For plain static sites, no build step is needed — just copy files.
  # For SPAs (React/Vue/Vite), the framework command installs deps and builds.
  dependencies:
    - busybox
    - nodejs-{NODE_VERSION}
    - npm<11
    - git
  distro:
    alpine:
      dependencies:
        - busybox
        - nodejs
        - npm
        - git
  # Default: plain HTML — no build tool, just copy static files.
  command: |
    mkdir -p ${{targets.destdir}}/usr/share/nginx/html
    tar --exclude=./melange-out --exclude=./.apexpack-output --exclude=./node_modules -cf - . \
      | tar -C ${{targets.destdir}}/usr/share/nginx/html -xf -
    if [ -f "nginx.conf" ]; then
      mkdir -p ${{targets.destdir}}/etc/nginx/http.d
      cp nginx.conf ${{targets.destdir}}/etc/nginx/http.d/default.conf
    fi
  env:
    NODE_ENV: "production"
    CI: "false"

  # Corporate Artifactory / Nexus npm registry URL (base path — ARTI_REPO is appended automatically).
  # Same as node profile. Required when SPA builds pull packages from a private registry.
  # Example: https://<host>/artifactory/api/npm
  npm_registry_url: ""

  tls_ca_env:
    - NODE_EXTRA_CA_CERTS  # Node.js (npm, yarn, pnpm, bun) — bundled OpenSSL, not SSL_CERT_FILE
    - SSL_CERT_FILE        # curl and other OpenSSL-linked tools used in build scripts

  frameworks:
    angular:
      command: |
        if [ -f "package-lock.json" ]; then npm ci --prefer-offline --include=dev || npm install --force --prefer-offline --include=dev
        elif [ -f "yarn.lock" ]; then npm install -g yarn && yarn install --frozen-lockfile --production=false
        elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun install --frozen-lockfile
        else npm install --prefer-offline --include=dev; fi
        if node -e "process.exitCode=require('./package.json').scripts?.build?0:1" 2>/dev/null; then
          if [ -f "package-lock.json" ]; then npm run build
          elif [ -f "yarn.lock" ]; then yarn build
          elif [ -f "pnpm-lock.yaml" ]; then pnpm run build
          elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun run build
          else npm run build; fi
        else ./node_modules/.bin/ng build; fi
        mkdir -p ${{targets.destdir}}/usr/share/nginx/html
        cp -r dist/. ${{targets.destdir}}/usr/share/nginx/html/
        if [ -f "nginx.conf" ]; then
          mkdir -p ${{targets.destdir}}/etc/nginx/http.d
          cp nginx.conf ${{targets.destdir}}/etc/nginx/http.d/default.conf
        fi
    vite:
      command: |
        if [ -f "package-lock.json" ]; then npm ci --prefer-offline --include=dev || npm install --force --prefer-offline --include=dev
        elif [ -f "yarn.lock" ]; then npm install -g yarn && yarn install --frozen-lockfile --production=false
        elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun install --frozen-lockfile
        else npm install --prefer-offline --include=dev; fi
        if [ -f "package-lock.json" ]; then npm run build
        elif [ -f "yarn.lock" ]; then yarn build
        elif [ -f "pnpm-lock.yaml" ]; then pnpm run build
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun run build
        else npm run build; fi
        mkdir -p ${{targets.destdir}}/usr/share/nginx/html
        cp -r dist/. ${{targets.destdir}}/usr/share/nginx/html/
        if [ -f "nginx.conf" ]; then
          mkdir -p ${{targets.destdir}}/etc/nginx/http.d
          cp nginx.conf ${{targets.destdir}}/etc/nginx/http.d/default.conf
        fi
    react:
      # CRA output is build/, not dist/. Vite+React projects are detected as vite, not react.
      command: |
        if [ -f "package-lock.json" ]; then npm ci --prefer-offline --include=dev || npm install --force --prefer-offline --include=dev
        elif [ -f "yarn.lock" ]; then npm install -g yarn && yarn install --frozen-lockfile --production=false
        elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun install --frozen-lockfile
        else npm install --prefer-offline --include=dev; fi
        if [ -f "package-lock.json" ]; then npm run build
        elif [ -f "yarn.lock" ]; then yarn build
        elif [ -f "pnpm-lock.yaml" ]; then pnpm run build
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun run build
        else npm run build; fi
        mkdir -p ${{targets.destdir}}/usr/share/nginx/html
        cp -r build/. ${{targets.destdir}}/usr/share/nginx/html/
        if [ -f "nginx.conf" ]; then
          mkdir -p ${{targets.destdir}}/etc/nginx/http.d
          cp nginx.conf ${{targets.destdir}}/etc/nginx/http.d/default.conf
        fi
    vue:
      command: |
        if [ -f "package-lock.json" ]; then npm ci --prefer-offline --include=dev || npm install --force --prefer-offline --include=dev
        elif [ -f "yarn.lock" ]; then npm install -g yarn && yarn install --frozen-lockfile --production=false
        elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun install --frozen-lockfile
        else npm install --prefer-offline --include=dev; fi
        if [ -f "package-lock.json" ]; then npm run build
        elif [ -f "yarn.lock" ]; then yarn build
        elif [ -f "pnpm-lock.yaml" ]; then pnpm run build
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun run build
        else npm run build; fi
        mkdir -p ${{targets.destdir}}/usr/share/nginx/html
        cp -r dist/. ${{targets.destdir}}/usr/share/nginx/html/
        if [ -f "nginx.conf" ]; then
          mkdir -p ${{targets.destdir}}/etc/nginx/http.d
          cp nginx.conf ${{targets.destdir}}/etc/nginx/http.d/default.conf
        fi
    svelte:
      command: |
        if [ -f "package-lock.json" ]; then npm ci --prefer-offline --include=dev || npm install --force --prefer-offline --include=dev
        elif [ -f "yarn.lock" ]; then npm install -g yarn && yarn install --frozen-lockfile --production=false
        elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun install --frozen-lockfile
        else npm install --prefer-offline --include=dev; fi
        if [ -f "package-lock.json" ]; then npm run build
        elif [ -f "yarn.lock" ]; then yarn build
        elif [ -f "pnpm-lock.yaml" ]; then pnpm run build
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun run build
        else npm run build; fi
        mkdir -p ${{targets.destdir}}/usr/share/nginx/html
        cp -r build/. ${{targets.destdir}}/usr/share/nginx/html/
        if [ -f "nginx.conf" ]; then
          mkdir -p ${{targets.destdir}}/etc/nginx/http.d
          cp nginx.conf ${{targets.destdir}}/etc/nginx/http.d/default.conf
        fi

image:
  # nginx serves the static files.
  # nginx-config-bundle provides a sensible default nginx.conf.
  packages:
    - nginx
    - ca-certificates-bundle=20260413-r0
  entrypoint: nginx
  cmd:
    - "-g"
    - "daemon off;"
  run-as: 65532
  ports:
    - "8080"
  env:
    NGINX_PORT: "8080"
  health-check:
    http:
      path: /
      port: 8080
    interval: 30s
    timeout: 5s
    start-period: 10s
    retries: 3

scan:
  auto-patch: false
  patch-persist: false

test:
  packages:
    - busybox
    - nginx
  pipeline:
    - runs: |
        nginx -v 2>&1
        echo "✓ nginx is installed"
