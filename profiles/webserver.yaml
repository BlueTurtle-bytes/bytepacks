# Webserver / Static site profile
# Detects: index.html (plain static), or SPA build markers (vite.config.*, angular.json)
# Supports: Plain HTML, React/Vue/Svelte SPA (Vite, CRA), Angular, Hugo, Jekyll
# Runtime image: Wolfi + nginx (serves static files)

runtime: webserver
version: "1"
description: Static site or SPA served by nginx (React, Vue, Angular, plain HTML)

detect:
  files:
    - index.html
    - vite.config.ts
    - vite.config.js
    - angular.json
    - hugo.toml
    - hugo.yaml
    - _config.yml
    - nginx.conf
  content:
    - file: nginx.conf
      contains: "server"
      boost-confidence: 0.20
    - file: package.json
      contains: "\"@angular/core\""
      boost-confidence: 0.05
      framework: angular
    - file: package.json
      contains: "\"vite\""
      boost-confidence: 0.05
      framework: vite
    - file: package.json
      contains: "\"react\""
      boost-confidence: 0.03
      framework: react
    - file: package.json
      contains: "\"vue\""
      boost-confidence: 0.03
      framework: vue
    - file: package.json
      contains: "\"svelte\""
      boost-confidence: 0.03
      framework: svelte
    - file: hugo.toml
      contains: "baseURL"
      boost-confidence: 0.05
      framework: hugo
    - file: hugo.yaml
      contains: "baseURL"
      boost-confidence: 0.05
      framework: hugo
  # Lower base confidence — webserver is a fallback when no language is detected.
  confidence: 0.70

build:
  # For plain static sites, no build step is needed — just copy files.
  # For SPAs (React/Vue/Vite), the framework command installs deps and builds.
  dependencies:
    - busybox
    - nodejs
    - npm
    - git
  # Default: plain HTML — no build tool, just copy static files.
  command: |
    mkdir -p ${{targets.destdir}}/usr/share/nginx/html
    tar --exclude=./melange-out --exclude=./.apexpack-output --exclude=./node_modules -cf - . \
      | tar -C ${{targets.destdir}}/usr/share/nginx/html -xf -
    if [ -f "nginx.conf" ]; then
      mkdir -p ${{targets.destdir}}/etc/nginx
      cp nginx.conf ${{targets.destdir}}/etc/nginx/nginx.conf
    fi
  env:
    NODE_ENV: "production"
    CI: "true"

  frameworks:
    angular:
      command: |
        if [ -f "yarn.lock" ]; then yarn install --frozen-lockfile
        elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun install --frozen-lockfile
        else npm ci --prefer-offline; fi
        npm run build 2>/dev/null || yarn build 2>/dev/null || pnpm run build 2>/dev/null || bun run build
        mkdir -p ${{targets.destdir}}/usr/share/nginx/html
        cp -r dist/. ${{targets.destdir}}/usr/share/nginx/html/
        if [ -f "nginx.conf" ]; then
          mkdir -p ${{targets.destdir}}/etc/nginx
          cp nginx.conf ${{targets.destdir}}/etc/nginx/nginx.conf
        fi
    vite:
      command: |
        if [ -f "yarn.lock" ]; then yarn install --frozen-lockfile
        elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun install --frozen-lockfile
        else npm ci --prefer-offline; fi
        if [ -f "yarn.lock" ]; then yarn build
        elif [ -f "pnpm-lock.yaml" ]; then pnpm run build
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun run build
        else npm run build; fi
        mkdir -p ${{targets.destdir}}/usr/share/nginx/html
        cp -r dist/. ${{targets.destdir}}/usr/share/nginx/html/
        if [ -f "nginx.conf" ]; then
          mkdir -p ${{targets.destdir}}/etc/nginx
          cp nginx.conf ${{targets.destdir}}/etc/nginx/nginx.conf
        fi
    react:
      # CRA output is build/, not dist/. Vite+React projects are detected as vite, not react.
      command: |
        if [ -f "yarn.lock" ]; then yarn install --frozen-lockfile
        elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun install --frozen-lockfile
        else npm ci --prefer-offline; fi
        if [ -f "yarn.lock" ]; then yarn build
        elif [ -f "pnpm-lock.yaml" ]; then pnpm run build
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun run build
        else npm run build; fi
        mkdir -p ${{targets.destdir}}/usr/share/nginx/html
        cp -r build/. ${{targets.destdir}}/usr/share/nginx/html/
        if [ -f "nginx.conf" ]; then
          mkdir -p ${{targets.destdir}}/etc/nginx
          cp nginx.conf ${{targets.destdir}}/etc/nginx/nginx.conf
        fi
    vue:
      command: |
        if [ -f "yarn.lock" ]; then yarn install --frozen-lockfile
        elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun install --frozen-lockfile
        else npm ci --prefer-offline; fi
        if [ -f "yarn.lock" ]; then yarn build
        elif [ -f "pnpm-lock.yaml" ]; then pnpm run build
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun run build
        else npm run build; fi
        mkdir -p ${{targets.destdir}}/usr/share/nginx/html
        cp -r dist/. ${{targets.destdir}}/usr/share/nginx/html/
        if [ -f "nginx.conf" ]; then
          mkdir -p ${{targets.destdir}}/etc/nginx
          cp nginx.conf ${{targets.destdir}}/etc/nginx/nginx.conf
        fi
    svelte:
      command: |
        if [ -f "yarn.lock" ]; then yarn install --frozen-lockfile
        elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun install --frozen-lockfile
        else npm ci --prefer-offline; fi
        if [ -f "yarn.lock" ]; then yarn build
        elif [ -f "pnpm-lock.yaml" ]; then pnpm run build
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then bun run build
        else npm run build; fi
        mkdir -p ${{targets.destdir}}/usr/share/nginx/html
        cp -r build/. ${{targets.destdir}}/usr/share/nginx/html/
        if [ -f "nginx.conf" ]; then
          mkdir -p ${{targets.destdir}}/etc/nginx
          cp nginx.conf ${{targets.destdir}}/etc/nginx/nginx.conf
        fi

image:
  # nginx serves the static files.
  # nginx-config-bundle provides a sensible default nginx.conf.
  packages:
    - nginx
    - ca-certificates-bundle=20260413-r0
  entrypoint: nginx
  cmd:
    - "-g"
    - "daemon off;"
  run-as: 65532
  ports:
    - "8080"
  env:
    NGINX_PORT: "8080"

scan:
  auto-patch: false
  patch-persist: false

test:
  packages:
    - busybox
    - nginx
  pipeline:
    - runs: |
        nginx -v 2>&1
        echo "✓ nginx is installed"
