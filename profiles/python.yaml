# Python language profile
# Detects: requirements.txt, pyproject.toml, Pipfile, setup.py
# Supports: FastAPI, Django, Flask, plain Python
# Package managers: pip (default), uv, poetry, pipenv
# Runtime image: Wolfi + python-3

runtime: python
version: "1"
description: Python application (FastAPI, Django, Flask, uvicorn)

detect:
  files:
    - requirements.txt
    - pyproject.toml
    - Pipfile
    - setup.py
  package-managers:
    - file: uv.lock
      manager: uv
    - file: poetry.lock
      manager: poetry
    - file: Pipfile.lock
      manager: pipenv
  content:
    - file: requirements.txt
      contains: "fastapi"
      boost-confidence: 0.04
      framework: fastapi
    - file: requirements.txt
      contains: "django"
      boost-confidence: 0.04
      framework: django
    - file: requirements.txt
      contains: "flask"
      boost-confidence: 0.04
      framework: flask
    - file: requirements.txt
      contains: "aiohttp"
      boost-confidence: 0.03
      framework: aiohttp
    - file: pyproject.toml
      contains: "fastapi"
      boost-confidence: 0.04
      framework: fastapi
    - file: pyproject.toml
      contains: "django"
      boost-confidence: 0.04
      framework: django
    - file: pyproject.toml
      contains: "flask"
      boost-confidence: 0.04
      framework: flask

  confidence: 0.85

build:
  dependencies:
    - busybox
    - python-{PYTHON_VERSION}
    - py3-pip
    - build-base
    - git
    - postgresql-dev  # pg_config for psycopg2/psycopg2-binary source builds on aarch64
    - unixodbc-dev    # odbc.h for pyodbc source builds on aarch64
  distro:
    alpine:
      dependencies:
        - busybox
        - python3
        - py3-pip
        - build-base
        - git
        - postgresql-dev
        - unixodbc-dev
  # Default: pip from requirements.txt
  command: |
    python{PYTHON_VERSION} -m ensurepip --upgrade
    python{PYTHON_VERSION} -m pip install --no-cache-dir -r requirements.txt --target ${{targets.destdir}}/app/deps
    mkdir -p ${{targets.destdir}}/app/src
    tar --exclude=./melange-out --exclude=./.apexpack-output -cf - . | tar -C ${{targets.destdir}}/app/src -xf -
    chmod -R a+rX ${{targets.destdir}}/app
    SITE_PKG=$(python{PYTHON_VERSION} -c "import sysconfig; print(sysconfig.get_path('purelib'))")
    mkdir -p "${{targets.destdir}}${SITE_PKG}"
    printf '/app/deps\n/app/src\n' > "${{targets.destdir}}${SITE_PKG}/apexpack-app.pth"
  env:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    PIP_NO_CACHE_DIR: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  caches:
    - /home/build/.cache/pip

  # Corporate Artifactory / Nexus PyPI registry URL (base path — ARTI_REPO is appended automatically).
  # When set, apexpack writes ~/.config/pip/pip.conf and ~/.pypirc into every build.
  # Requires ARTI_USER + ARTI_REPO + ARTI_PASSWORD.
  # Example: https://<host>/artifactory/api/pypi
  pypi_registry_url: ""

  tls_ca_env:
    - SSL_CERT_FILE        # Python ssl module (OpenSSL-linked)
    - REQUESTS_CA_BUNDLE   # requests library (used by pip, poetry, pipenv)
    - PIP_CERT             # pip certificate override

  tls_runtime_ca_env:
    - REQUESTS_CA_BUNDLE  # requests library reads this for extra trusted CAs at runtime

  frameworks:
    uv:
      dependencies:
        - busybox
        - python-{PYTHON_VERSION}
        - uv
        - build-base
        - git
        - postgresql-dev
        - unixodbc-dev
      distro:
        alpine:
          dependencies:
            - busybox
            - python3
            - uv
            - build-base
            - git
            - postgresql-dev
            - unixodbc-dev
      command: |
        uv pip install --python python{PYTHON_VERSION} -r requirements.txt --target ${{targets.destdir}}/app/deps
        mkdir -p ${{targets.destdir}}/app/src
        tar --exclude=./melange-out --exclude=./.apexpack-output -cf - . | tar -C ${{targets.destdir}}/app/src -xf -
        chmod -R a+rX ${{targets.destdir}}/app
        SITE_PKG=$(python{PYTHON_VERSION} -c "import sysconfig; print(sysconfig.get_path('purelib'))")
        mkdir -p "${{targets.destdir}}${SITE_PKG}"
        printf '/app/deps\n/app/src\n' > "${{targets.destdir}}${SITE_PKG}/apexpack-app.pth"
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONUNBUFFERED: "1"
        UV_CACHE_DIR: "/home/build/.cache/uv"
      caches:
        - /home/build/.cache/uv

    poetry:
      dependencies:
        - busybox
        - python-{PYTHON_VERSION}
        - py3-poetry
        - build-base
        - git
        - postgresql-dev
        - unixodbc-dev
      distro:
        alpine:
          dependencies:
            - busybox
            - python3
            - py3-pip
            - build-base
            - git
            - postgresql-dev
            - unixodbc-dev
      command: |
        which poetry 2>/dev/null || pip install poetry --quiet --break-system-packages 2>/dev/null || pip install poetry --quiet
        sed -i 's/^\(python\s*=\s*\)"[~^>=<0-9., *]*"/\1">=3.8"/' pyproject.toml || true
        poetry config virtualenvs.in-project true
        poetry install --only main --no-interaction --no-ansi
        mkdir -p ${{targets.destdir}}/app/deps
        cp -r .venv/lib/python*/site-packages/. ${{targets.destdir}}/app/deps/
        mkdir -p ${{targets.destdir}}/app/src
        tar --exclude=./melange-out --exclude=./.apexpack-output --exclude=./.venv -cf - . | tar -C ${{targets.destdir}}/app/src -xf -
        chmod -R a+rX ${{targets.destdir}}/app
        SITE_PKG=$(python{PYTHON_VERSION} -c "import sysconfig; print(sysconfig.get_path('purelib'))")
        mkdir -p "${{targets.destdir}}${SITE_PKG}"
        printf '/app/deps\n/app/src\n' > "${{targets.destdir}}${SITE_PKG}/apexpack-app.pth"
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONUNBUFFERED: "1"
        POETRY_CACHE_DIR: "/home/build/.cache/pypoetry"
        PIP_NO_CACHE_DIR: "1"
      caches:
        - /home/build/.cache/pypoetry
        - /home/build/.cache/pip

    pipenv:
      distro:
        alpine:
          dependencies:
            - busybox
            - python3
            - py3-pip
            - build-base
            - git
            - postgresql-dev
            - unixodbc-dev
      command: |
        python{PYTHON_VERSION} -m ensurepip --upgrade
        python{PYTHON_VERSION} -m pip install pipenv
        pipenv requirements > /tmp/requirements.txt
        python{PYTHON_VERSION} -m pip install --no-cache-dir -r /tmp/requirements.txt --target ${{targets.destdir}}/app/deps
        mkdir -p ${{targets.destdir}}/app/src
        tar --exclude=./melange-out --exclude=./.apexpack-output -cf - . | tar -C ${{targets.destdir}}/app/src -xf -
        chmod -R a+rX ${{targets.destdir}}/app
        SITE_PKG=$(python{PYTHON_VERSION} -c "import sysconfig; print(sysconfig.get_path('purelib'))")
        mkdir -p "${{targets.destdir}}${SITE_PKG}"
        printf '/app/deps\n/app/src\n' > "${{targets.destdir}}${SITE_PKG}/apexpack-app.pth"
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONUNBUFFERED: "1"
        PIP_NO_CACHE_DIR: "1"
        PIPENV_CACHE_DIR: "/home/build/.cache/pipenv"
      caches:
        - /home/build/.cache/pip
        - /home/build/.cache/pipenv

image:
  packages:
    - python-{PYTHON_VERSION}
    - ca-certificates-bundle=20260413-r0
  distro:
    alpine:
      packages:
        - alpine-release
        - python3
        - ca-certificates
  entrypoint: python3
  # Default: run main.py directly. FastAPI/ASGI projects should override via
  # apexpacks.yaml image.cmd: ["-m", "uvicorn", "main:app", "--host=0.0.0.0", "--port=8000"]
  cmd:
    - "/app/src/main.py"
  run-as: 65532
  ports:
    - "8000"
  env:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    PYTHONPATH: "/app/deps:/app/src"
  health-check:
    http:
      port: 8000
    interval: 30s
    timeout: 5s
    start-period: 15s
    retries: 3

scan:
  auto-patch: false
  patch-persist: false

test:
  packages:
    - busybox
    - python-{PYTHON_VERSION}
  distro:
    alpine:
      packages:
        - busybox
        - python3
  pipeline:
    - runs: |
        test -d /app/src || { echo "ERROR: /app/src not found"; exit 1; }
        test -d /app/deps || { echo "ERROR: /app/deps not found"; exit 1; }
        python3 --version
        echo "✓ Python app structure at /app is valid"

