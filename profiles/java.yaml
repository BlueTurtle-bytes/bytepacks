# Java language profile
# Detects Maven projects (pom.xml) and Gradle projects (build.gradle / build.gradle.kts)
# Supports: Spring Boot, Quarkus, Micronaut, plain Java
# Runtime image: Wolfi + openjdk-21-jre (JRE only — smaller attack surface than JDK)

runtime: java
version: "1"
description: Java application (Maven or Gradle, Spring Boot, Quarkus)

detect:
  files:
    - pom.xml
    - build.gradle
    - build.gradle.kts
  content:
    - file: pom.xml
      contains: "spring-boot"
      boost-confidence: 0.05
      framework: spring-boot
    - file: pom.xml
      contains: "quarkus"
      boost-confidence: 0.05
      framework: quarkus
    - file: pom.xml
      contains: "micronaut"
      boost-confidence: 0.05
      framework: micronaut
    - file: build.gradle
      contains: "spring-boot"
      boost-confidence: 0.05
      framework: spring-boot-gradle
    - file: build.gradle.kts
      contains: "spring-boot"
      boost-confidence: 0.05
      framework: spring-boot-gradle
    - file: build.gradle
      contains: "quarkus"
      boost-confidence: 0.05
      framework: quarkus-gradle
    - file: build.gradle.kts
      contains: "quarkus"
      boost-confidence: 0.05
      framework: quarkus-gradle
    - file: build.gradle
      contains: "micronaut"
      boost-confidence: 0.05
      framework: micronaut-gradle
    - file: build.gradle.kts
      contains: "micronaut"
      boost-confidence: 0.05
      framework: micronaut-gradle
  confidence: 0.85

build:
  # openjdk-{JAVA_VERSION} provides the JDK needed to compile.
  # maven is the build tool. build-base provides make, gcc etc.
  dependencies:
    - busybox
    - openjdk-{JAVA_VERSION}
    - maven
    - build-base
    - git
  # Default: plain Maven project with no detected framework.
  command: |
    [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d 2>/dev/null | head -1)
    export PATH="$JAVA_HOME/bin:$PATH"
    if [ -f "/home/build/.apexpack-truststore.p12" ]; then
      export MAVEN_OPTS="${MAVEN_OPTS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
    fi
    MVN_SETTINGS=""
    if [ -f "/home/build/.m2/settings.xml" ]; then MVN_SETTINGS="-s /home/build/.m2/settings.xml"; fi
    mvn package -DskipTests -B -q $MVN_SETTINGS
    mkdir -p ${{targets.destdir}}/app
    cp target/*.jar ${{targets.destdir}}/app/app.jar
  env:
    JAVA_HOME: "/usr/lib/jvm/java-{JAVA_VERSION}-openjdk"
    MAVEN_OPTS: "-Xmx512m -XX:+UseContainerSupport"
    GRADLE_OPTS: "-Xmx512m -XX:+UseContainerSupport"
  caches:
    - /home/build/.m2/repository

  # Corporate Artifactory / Nexus mirror for Maven projects (pom.xml / Maven multi-module).
  # Set to your Artifactory virtual repo URL; leave empty to resolve from Maven Central.
  # Injected as ~/.m2/settings.xml when ARTI_USER is set. Skipped for Gradle frameworks.
  # Example: https://<host>/artifactory/maven-virtual
  maven_mirror_url: ""

  # Corporate Artifactory / Nexus mirror for Gradle projects (build.gradle / build.gradle.kts).
  # Injected as ~/.gradle/init.d/artifactory.gradle when ARTI_USER is set.
  # Covers project repos, buildscript classpath, and plugin resolution.
  # Example: https://<host>/artifactory/gradle-virtual
  gradle_mirror_url: ""

  # Base URL of the Artifactory repo that hosts Gradle distribution zips.
  # When set, apexpack rewrites gradle-wrapper.properties distributionUrl so the
  # wrapper fetches gradle-X.Y-bin.zip from here instead of services.gradle.org.
  # This is separate from gradle_mirror_url — distributions live in a different repo.
  # Example: https://<host>/artifactory/gradle-distributions
  gradle_distribution_url: ""

  # Gradle init script template. Built-ins: "default", "corporate" (adds Gradle 7+ support).
  gradle_settings_template: "corporate"

  # settings.xml template to use. Built-ins: "default" (mirrors+servers only),
  # "corporate" (adds pluginRepositories + profiles + activeProfiles).
  # Custom: drop <profiles-dir>/templates/maven/<name>.xml into your profiles repo.
  maven_settings_template: "corporate"

  tls_ca_env: []  # JVM ignores SSL_CERT_FILE; tls_ca_pre_step + build command handle it
  tls_ca_pre_step: |
    [ -f /home/build/.apexpack-ca.crt ] || exit 0
    KEYTOOL=$(find /usr/lib/jvm -name "keytool" 2>/dev/null | head -1)
    if [ -z "$KEYTOOL" ]; then
      echo "ERROR: keytool not found under /usr/lib/jvm" >&2; exit 1
    fi
    cat /home/build/.apexpack-ca.crt >> /etc/ssl/certs/ca-certificates.crt
    update-ca-certificates 2>/dev/null || true
    # keytool -importcert only reads the first PEM block in a multi-cert bundle.
    # Split the bundle into individual files and import each one separately so
    # every CA in the bundle (e.g. Absa internal root + Netskope CertServiceCA)
    # ends up in the JVM truststore.
    awk '/-----BEGIN CERTIFICATE-----/{n++;f="/tmp/apexpack-cert-"n".pem"} f{print > f} /-----END CERTIFICATE-----/{f=""}' /home/build/.apexpack-ca.crt
    CERT_COUNT=0
    for certfile in /tmp/apexpack-cert-*.pem; do
      [ -f "$certfile" ] || continue
      idx=$(echo "$certfile" | grep -oE '[0-9]+')
      "$KEYTOOL" -importcert -noprompt -alias "apexpack-corp-ca-${idx}" \
        -file "$certfile" -cacerts -storepass changeit 2>/dev/null || true
      rm -f "$certfile"
      CERT_COUNT=$((CERT_COUNT + 1))
    done
    echo "→ Truststore ready: imported ${CERT_COUNT} corp CA cert(s)"

  frameworks:
    quarkus:
      # Quarkus default output is a fast-jar directory — uber-jar gives a single runnable JAR.
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d 2>/dev/null | head -1)
        export PATH="$JAVA_HOME/bin:$PATH"
        if [ -f "/home/build/.apexpack-truststore.p12" ]; then
          export MAVEN_OPTS="${MAVEN_OPTS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
        fi
        MVN_SETTINGS=""
        if [ -f "/home/build/.m2/settings.xml" ]; then MVN_SETTINGS="-s /home/build/.m2/settings.xml"; fi
        mvn package -DskipTests -B -q -Dquarkus.package.jar.type=uber-jar $MVN_SETTINGS
        mkdir -p ${{targets.destdir}}/app
        cp target/*-runner.jar ${{targets.destdir}}/app/app.jar
    spring-boot-gradle:
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d 2>/dev/null | head -1)
        export PATH="$JAVA_HOME/bin:$PATH"
        echo "→ distributionUrl after rewrite:"
        grep "^distributionUrl=" gradle/wrapper/gradle-wrapper.properties || echo "  (not found)"
        DIST_URL=$(grep "^distributionUrl=" gradle/wrapper/gradle-wrapper.properties | sed 's/distributionUrl=//' | sed 's/\\:/:/g')
        echo "→ curl connectivity test to distribution URL:"
        curl --connect-timeout 10 -sI "$DIST_URL" 2>&1 | head -5 || echo "  curl failed"
        chmod +x ./gradlew
        ./gradlew build -x test --no-daemon -q
        mkdir -p ${{targets.destdir}}/app
        JAR=$(find build/libs -name "*.jar" ! -name "*-plain.jar" | head -1)
        [ -n "$JAR" ] || { echo "ERROR: no bootJar found in build/libs" >&2; exit 1; }
        cp "$JAR" ${{targets.destdir}}/app/app.jar
      caches:
        - /home/build/.gradle
    quarkus-gradle:
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d 2>/dev/null | head -1)
        export PATH="$JAVA_HOME/bin:$PATH"
        if [ -f "/home/build/.apexpack-truststore.p12" ]; then
          export GRADLE_OPTS="${GRADLE_OPTS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
        fi
        chmod +x ./gradlew
        ./gradlew build -Dquarkus.package.jar.type=uber-jar -x test --no-daemon -q
        mkdir -p ${{targets.destdir}}/app
        cp build/quarkus-app/*-runner.jar ${{targets.destdir}}/app/app.jar
      caches:
        - /home/build/.gradle
    micronaut-gradle:
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d 2>/dev/null | head -1)
        export PATH="$JAVA_HOME/bin:$PATH"
        if [ -f "/home/build/.apexpack-truststore.p12" ]; then
          export GRADLE_OPTS="${GRADLE_OPTS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
        fi
        chmod +x ./gradlew
        ./gradlew build -x test --no-daemon -q
        mkdir -p ${{targets.destdir}}/app
        cp build/libs/*.jar ${{targets.destdir}}/app/app.jar
      caches:
        - /home/build/.gradle

image:
  # JRE only — not JDK. No compiler in the final image reduces attack surface.
  packages:
    - openjdk-{JAVA_VERSION}-jre
    - ca-certificates-bundle=20260413-r0
  # java -jar is the entrypoint. The JAR path is passed via cmd.
  entrypoint: java
  cmd:
    - "-jar"
    - "/app/app.jar"
  run-as: 65532
  ports:
    - "8080"
  env:
    JAVA_HOME: "/usr/lib/jvm/java-{JAVA_VERSION}-openjdk"
    JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
  health-check:
    http:
      path: /
      port: 8080
    interval: 30s
    timeout: 10s
    start-period: 60s
    retries: 3

scan:
  auto-patch: true
  patch-persist: false

test:
  packages:
    - busybox
    - openjdk-{JAVA_VERSION}-jre
  pipeline:
    - runs: |
        test -s /app/app.jar || { echo "ERROR: /app/app.jar not found or empty"; exit 1; }
        JAVA_BIN=$(find /usr/lib/jvm -name java -type f 2>/dev/null | head -1)
        if [ -z "$JAVA_BIN" ]; then JAVA_BIN=$(command -v java 2>/dev/null); fi
        if [ -z "$JAVA_BIN" ]; then echo "ERROR: java binary not found"; exit 1; fi
        "$JAVA_BIN" -version 2>&1 | head -2
        echo "✓ /app/app.jar present, Java runtime available"
