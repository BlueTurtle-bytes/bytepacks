# Java language profile
# Detects Maven projects (pom.xml) and Gradle projects (build.gradle / build.gradle.kts)
# Supports: Spring Boot, Quarkus, Micronaut, plain Java
# Runtime image: Wolfi + openjdk-21-jre (JRE only — smaller attack surface than JDK)

runtime: java
version: "1"
description: Java application (Maven or Gradle, Spring Boot, Quarkus)

detect:
  files:
    - pom.xml
    - build.gradle
    - build.gradle.kts
  content:
    - file: pom.xml
      contains: "spring-boot"
      boost-confidence: 0.05
      framework: spring-boot
    - file: pom.xml
      contains: "quarkus"
      boost-confidence: 0.05
      framework: quarkus
    - file: pom.xml
      contains: "micronaut"
      boost-confidence: 0.05
      framework: micronaut
    - file: build.gradle
      contains: "spring-boot"
      boost-confidence: 0.05
      framework: spring-boot-gradle
    - file: build.gradle.kts
      contains: "spring-boot"
      boost-confidence: 0.05
      framework: spring-boot-gradle
    - file: build.gradle
      contains: "quarkus"
      boost-confidence: 0.05
      framework: quarkus-gradle
    - file: build.gradle.kts
      contains: "quarkus"
      boost-confidence: 0.05
      framework: quarkus-gradle
    - file: build.gradle
      contains: "micronaut"
      boost-confidence: 0.05
      framework: micronaut-gradle
    - file: build.gradle.kts
      contains: "micronaut"
      boost-confidence: 0.05
      framework: micronaut-gradle
  confidence: 0.85

build:
  # openjdk-{JAVA_VERSION} provides the JDK needed to compile.
  # maven is the build tool. build-base provides make, gcc etc.
  dependencies:
    - busybox
    - openjdk-{JAVA_VERSION}
    - maven
    - build-base
    - git
  # Default: plain Maven project with no detected framework.
  command: |
    [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d 2>/dev/null | head -1)
    export PATH="$JAVA_HOME/bin:$PATH"
    if [ -f "/home/build/.apexpack-truststore.jks" ]; then
      export MAVEN_OPTS="${MAVEN_OPTS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.jks -Djavax.net.ssl.trustStoreType=JKS -Djavax.net.ssl.trustStorePassword=changeit"
    fi
    MVN_SETTINGS=""
    if [ -f "/home/build/.m2/settings.xml" ]; then MVN_SETTINGS="-s /home/build/.m2/settings.xml"; fi
    mvn package -DskipTests -B -q $MVN_SETTINGS
    mkdir -p ${{targets.destdir}}/app
    cp target/*.jar ${{targets.destdir}}/app/app.jar
  env:
    JAVA_HOME: "/usr/lib/jvm/java-{JAVA_VERSION}-openjdk"
    MAVEN_OPTS: "-Xmx512m -XX:+UseContainerSupport"
    GRADLE_OPTS: "-Xmx512m -XX:+UseContainerSupport"
  caches:
    - /home/build/.m2/repository

  # Corporate Artifactory / Nexus mirror for Maven projects (pom.xml / Maven multi-module).
  # Set to your Artifactory virtual repo URL; leave empty to resolve from Maven Central.
  # Injected as ~/.m2/settings.xml when ARTI_USER is set. Skipped for Gradle frameworks.
  # Example: https://<host>/artifactory/maven-virtual
  maven_mirror_url: ""

  # Corporate Artifactory / Nexus mirror for Gradle projects (build.gradle / build.gradle.kts).
  # Injected as ~/.gradle/init.d/artifactory.gradle when ARTI_USER is set.
  # Covers project repos, buildscript classpath, and plugin resolution.
  # Example: https://<host>/artifactory/gradle-virtual
  gradle_mirror_url: ""

  # Gradle init script template. Built-ins: "default", "corporate" (adds Gradle 7+ support).
  gradle_settings_template: "corporate"

  # settings.xml template to use. Built-ins: "default" (mirrors+servers only),
  # "corporate" (adds pluginRepositories + profiles + activeProfiles).
  # Custom: drop <profiles-dir>/templates/maven/<name>.xml into your profiles repo.
  maven_settings_template: "corporate"

  tls_ca_env: []  # JVM ignores SSL_CERT_FILE; tls_ca_pre_step + JAVA_TOOL_OPTIONS handle it
  tls_ca_pre_step: |
    [ -f /home/build/.apexpack-ca.crt ] || exit 0
    KEYTOOL=$(find /usr/lib/jvm -name "keytool" 2>/dev/null | head -1)
    JAVA_CACERTS=$(find /usr/lib/jvm -name "cacerts" 2>/dev/null | head -1)
    if [ -z "$KEYTOOL" ]; then
      echo "ERROR: keytool not found under /usr/lib/jvm" >&2; exit 1
    fi
    if [ -z "$JAVA_CACERTS" ]; then
      echo "ERROR: cacerts not found under /usr/lib/jvm" >&2; exit 1
    fi
    # Detect the source cacerts password — Java 17 PKCS12 stores often use an empty
    # password while older JKS stores use "changeit". Try both so the importkeystore
    # step doesn't silently skip all public CAs, which would cause PKIX failures for
    # any host NOT behind the corporate MITM proxy (e.g. services.gradle.org direct).
    CACERTS_PASS=""
    for TRY_PASS in changeit "" ; do
      if "$KEYTOOL" -list -keystore "$JAVA_CACERTS" -storepass "$TRY_PASS" -noprompt >/dev/null 2>&1; then
        CACERTS_PASS="$TRY_PASS"
        echo "→ cacerts password detected: '${TRY_PASS}'"
        break
      fi
    done
    # PRIMARY: import corp CA directly into the system cacerts. Melange runs as root so
    # the file is writable. Every JVM process (including the Gradle wrapper) uses the
    # system cacerts by default — no flags needed.
    "$KEYTOOL" -importcert -noprompt -alias apexpack-corp-ca \
      -file /home/build/.apexpack-ca.crt \
      -keystore "$JAVA_CACERTS" -storepass "$CACERTS_PASS" 2>&1 \
      && echo "→ Corp CA imported into system cacerts" \
      || echo "WARN: system cacerts import failed (read-only?), falling back to custom store"
    # FALLBACK: also build a custom JKS with corp CA + all system CAs.
    # Used via JAVA_TOOL_OPTIONS in case the system cacerts import above didn't work.
    STORE=/home/build/.apexpack-truststore.jks
    "$KEYTOOL" -importcert -noprompt -alias apexpack-corp-ca \
      -file /home/build/.apexpack-ca.crt \
      -keystore "$STORE" -storetype JKS -storepass changeit
    if [ $? -ne 0 ]; then
      echo "ERROR: keytool import into custom store failed" >&2; exit 1
    fi
    "$KEYTOOL" -importkeystore \
      -srckeystore "$JAVA_CACERTS" -srcstorepass "$CACERTS_PASS" \
      -destkeystore "$STORE" -deststorepass changeit \
      -deststoretype JKS -noprompt 2>/dev/null \
      && echo "→ System CAs merged into custom JKS" \
      || echo "WARN: system CA merge failed — custom store has corp CA only"
    ENTRY_COUNT=$("$KEYTOOL" -list -keystore "$STORE" -storepass changeit 2>/dev/null | grep -c "trustedCertEntry" || echo 0)
    echo "→ Custom JKS truststore: ${ENTRY_COUNT} trusted entries"

  frameworks:
    quarkus:
      # Quarkus default output is a fast-jar directory — uber-jar gives a single runnable JAR.
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d 2>/dev/null | head -1)
        export PATH="$JAVA_HOME/bin:$PATH"
        if [ -f "/home/build/.apexpack-truststore.jks" ]; then
          export MAVEN_OPTS="${MAVEN_OPTS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.jks -Djavax.net.ssl.trustStoreType=JKS -Djavax.net.ssl.trustStorePassword=changeit"
        fi
        MVN_SETTINGS=""
        if [ -f "/home/build/.m2/settings.xml" ]; then MVN_SETTINGS="-s /home/build/.m2/settings.xml"; fi
        mvn package -DskipTests -B -q -Dquarkus.package.jar.type=uber-jar $MVN_SETTINGS
        mkdir -p ${{targets.destdir}}/app
        cp target/*-runner.jar ${{targets.destdir}}/app/app.jar
    spring-boot-gradle:
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d 2>/dev/null | head -1)
        export PATH="$JAVA_HOME/bin:$PATH"
        if [ -f "/home/build/.apexpack-truststore.jks" ]; then
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.jks -Djavax.net.ssl.trustStoreType=JKS -Djavax.net.ssl.trustStorePassword=changeit"
        fi
        chmod +x ./gradlew
        ./gradlew build -x test --no-daemon -q
        mkdir -p ${{targets.destdir}}/app
        cp build/libs/*.jar ${{targets.destdir}}/app/app.jar
      caches:
        - /home/build/.gradle
    quarkus-gradle:
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d 2>/dev/null | head -1)
        export PATH="$JAVA_HOME/bin:$PATH"
        if [ -f "/home/build/.apexpack-truststore.jks" ]; then
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.jks -Djavax.net.ssl.trustStoreType=JKS -Djavax.net.ssl.trustStorePassword=changeit"
        fi
        chmod +x ./gradlew
        ./gradlew build -Dquarkus.package.jar.type=uber-jar -x test --no-daemon -q
        mkdir -p ${{targets.destdir}}/app
        cp build/quarkus-app/*-runner.jar ${{targets.destdir}}/app/app.jar
      caches:
        - /home/build/.gradle
    micronaut-gradle:
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d 2>/dev/null | head -1)
        export PATH="$JAVA_HOME/bin:$PATH"
        if [ -f "/home/build/.apexpack-truststore.jks" ]; then
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.jks -Djavax.net.ssl.trustStoreType=JKS -Djavax.net.ssl.trustStorePassword=changeit"
        fi
        chmod +x ./gradlew
        ./gradlew build -x test --no-daemon -q
        mkdir -p ${{targets.destdir}}/app
        cp build/libs/*.jar ${{targets.destdir}}/app/app.jar
      caches:
        - /home/build/.gradle

image:
  # JRE only — not JDK. No compiler in the final image reduces attack surface.
  packages:
    - openjdk-{JAVA_VERSION}-jre
    - ca-certificates-bundle=20260413-r0
  # java -jar is the entrypoint. The JAR path is passed via cmd.
  entrypoint: java
  cmd:
    - "-jar"
    - "/app/app.jar"
  run-as: 65532
  ports:
    - "8080"
  env:
    JAVA_HOME: "/usr/lib/jvm/java-{JAVA_VERSION}-openjdk"
    JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

scan:
  auto-patch: true
  patch-persist: false

test:
  packages:
    - busybox
    - openjdk-{JAVA_VERSION}-jre
  pipeline:
    - runs: |
        test -s /app/app.jar || { echo "ERROR: /app/app.jar not found or empty"; exit 1; }
        export PATH="/usr/lib/jvm/java-{JAVA_VERSION}-openjdk/bin:$PATH"
        java -version 2>&1 | head -2
        echo "✓ /app/app.jar present, Java runtime available"
