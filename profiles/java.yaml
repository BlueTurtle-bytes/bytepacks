# Java language profile
# Detects Maven projects (pom.xml) and Gradle projects (build.gradle / build.gradle.kts)
# Supports: Spring Boot, Quarkus, Micronaut, plain Java
# Runtime image: Wolfi + openjdk-21-jre (JRE only — smaller attack surface than JDK)

runtime: java
version: "1"
description: Java application (Maven or Gradle, Spring Boot, Quarkus)

detect:
  files:
    - pom.xml
    - build.gradle
    - build.gradle.kts
  content:
    - file: pom.xml
      contains: "spring-boot"
      boost-confidence: 0.05
      framework: spring-boot
    - file: pom.xml
      contains: "quarkus"
      boost-confidence: 0.05
      framework: quarkus
    - file: pom.xml
      contains: "micronaut"
      boost-confidence: 0.05
      framework: micronaut
    - file: build.gradle
      contains: "spring-boot"
      boost-confidence: 0.05
      framework: spring-boot-gradle
    - file: build.gradle.kts
      contains: "spring-boot"
      boost-confidence: 0.05
      framework: spring-boot-gradle
    - file: build.gradle
      contains: "quarkus"
      boost-confidence: 0.05
      framework: quarkus-gradle
    - file: build.gradle.kts
      contains: "quarkus"
      boost-confidence: 0.05
      framework: quarkus-gradle
    - file: build.gradle
      contains: "micronaut"
      boost-confidence: 0.05
      framework: micronaut-gradle
    - file: build.gradle.kts
      contains: "micronaut"
      boost-confidence: 0.05
      framework: micronaut-gradle
  confidence: 0.85

build:
  # openjdk-{JAVA_VERSION} provides the JDK needed to compile.
  # maven is the build tool. build-base provides make, gcc etc.
  dependencies:
    - busybox
    - openjdk-{JAVA_VERSION}
    - maven
    - build-base
    - git
  distro:
    alpine:
      dependencies:
        - busybox
        - openjdk{JAVA_VERSION}-jdk
        - maven
        - build-base
        - git
  # Default: plain Maven project with no detected framework.
  command: |
    [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d -print -quit 2>/dev/null)
    export PATH="$JAVA_HOME/bin:$PATH"
    if [ -f "/home/build/.apexpack-truststore.p12" ]; then
      export MAVEN_OPTS="${MAVEN_OPTS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
    fi
    MVN_SETTINGS=""
    if [ -f "/home/build/.m2/settings.xml" ]; then MVN_SETTINGS="-s /home/build/.m2/settings.xml"; fi
    mvn package -DskipTests -B -q $MVN_SETTINGS ${MAVEN_EXTRA_ARGS:-}
    mkdir -p ${{targets.destdir}}/app
    JAR=""
    for f in target/*.jar; do
      [ -f "$f" ] || continue
      if "$JAVA_HOME/bin/jar" tf "$f" 2>/dev/null | grep -q "^BOOT-INF/"; then
        JAR="$f"; break
      fi
    done
    if [ -z "$JAR" ]; then JAR=$(ls -S target/*.jar 2>/dev/null | head -1); fi
    [ -n "$JAR" ] || { echo "ERROR: no JAR found in target/" >&2; exit 1; }
    cp "$JAR" ${{targets.destdir}}/app/app.jar
  env:
    JAVA_HOME: "/usr/lib/jvm/java-{JAVA_VERSION}-openjdk"
    MAVEN_OPTS: "-Xmx512m -XX:+UseContainerSupport"
    GRADLE_OPTS: "-Xmx512m -XX:+UseContainerSupport"
  caches:
    - /home/build/.m2/repository

  # Corporate Artifactory / Nexus mirror for Maven projects (pom.xml / Maven multi-module).
  # Set to your Artifactory virtual repo URL; leave empty to resolve from Maven Central.
  # Injected as ~/.m2/settings.xml when ARTI_USER is set. Skipped for Gradle frameworks.
  # Example: https://<host>/artifactory/maven-virtual
  maven_mirror_url: ""

  # Corporate Artifactory / Nexus mirror for Gradle projects (build.gradle / build.gradle.kts).
  # Injected as ~/.gradle/init.d/artifactory.gradle when ARTI_USER is set.
  # Covers project repos, buildscript classpath, and plugin resolution.
  # Example: https://<host>/artifactory/gradle-virtual
  gradle_mirror_url: ""

  # Base URL of the Artifactory repo that hosts Gradle distribution zips.
  # When set, apexpack rewrites gradle-wrapper.properties distributionUrl so the
  # wrapper fetches gradle-X.Y-bin.zip from here instead of services.gradle.org.
  # This is separate from gradle_mirror_url — distributions live in a different repo.
  # Example: https://<host>/artifactory/gradle-distributions
  gradle_distribution_url: ""

  # Gradle init script template. Built-ins: "default", "corporate" (adds Gradle 7+ support).
  gradle_settings_template: "corporate"

  # settings.xml template to use. Built-ins: "default" (mirrors+servers only),
  # "corporate" (adds pluginRepositories + profiles + activeProfiles).
  # Custom: drop <profiles-dir>/templates/maven/<name>.xml into your profiles repo.
  maven_settings_template: "corporate"

  maven_extra_args: "-Denforcer.skip=true"

  tls_ca_env: []  # JVM ignores SSL_CERT_FILE; tls_ca_pre_step + build command handle it

  tls_runtime_ca_pre_exec: |
    JAVA_CACERTS=/etc/ssl/certs/cacerts
    if [ -f "$JAVA_CACERTS" ]; then
      cp "$JAVA_CACERTS" /tmp/apexpack-cacerts
      awk '/-----BEGIN CERTIFICATE-----/{n++;f="/tmp/apexpack-rt-cert-"n".pem"} f{print > f} /-----END CERTIFICATE-----/{f=""}' /tmp/apexpack-runtime-ca.pem
      KEYTOOL=$(find /usr/lib/jvm -name "keytool" -print -quit 2>/dev/null)
      if [ -n "$KEYTOOL" ]; then
        for certfile in /tmp/apexpack-rt-cert-*.pem; do
          [ -f "$certfile" ] || continue
          "$KEYTOOL" -importcert -noprompt -alias "apexpack-rt-$(basename "$certfile")" \
            -keystore /tmp/apexpack-cacerts -storepass changeit -file "$certfile" 2>/dev/null || true
          rm -f "$certfile"
        done
      fi
      export JDK_JAVA_OPTIONS="${JDK_JAVA_OPTIONS:+$JDK_JAVA_OPTIONS }-Djavax.net.ssl.trustStore=/tmp/apexpack-cacerts -Djavax.net.ssl.trustStorePassword=changeit"
    fi
  tls_ca_pre_step: |
    [ -f /home/build/.apexpack-ca.crt ] || exit 0
    KEYTOOL=$(find /usr/lib/jvm -name "keytool" -print -quit 2>/dev/null)
    if [ -z "$KEYTOOL" ]; then
      echo "ERROR: keytool not found under /usr/lib/jvm" >&2; exit 1
    fi
    cat /home/build/.apexpack-ca.crt >> /etc/ssl/certs/ca-certificates.crt
    update-ca-certificates 2>/dev/null || true
    # keytool -importcert only reads the first PEM block in a multi-cert bundle.
    # Split the bundle into individual files and import each one separately so
    # every CA in the bundle (e.g. Absa internal root + Netskope CertServiceCA)
    # ends up in the JVM truststore.
    awk '/-----BEGIN CERTIFICATE-----/{n++;f="/tmp/apexpack-cert-"n".pem"} f{print > f} /-----END CERTIFICATE-----/{f=""}' /home/build/.apexpack-ca.crt
    CERT_COUNT=0
    for certfile in /tmp/apexpack-cert-*.pem; do
      [ -f "$certfile" ] || continue
      idx=$(echo "$certfile" | grep -oE '[0-9]+')
      "$KEYTOOL" -importcert -noprompt -alias "apexpack-corp-ca-${idx}" \
        -file "$certfile" -cacerts -storepass changeit 2>/dev/null || true
      rm -f "$certfile"
      CERT_COUNT=$((CERT_COUNT + 1))
    done
    echo "→ Truststore ready: imported ${CERT_COUNT} corp CA cert(s)"

  frameworks:
    quarkus:
      # Quarkus default output is a fast-jar directory — uber-jar gives a single runnable JAR.
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d -print -quit 2>/dev/null)
        export PATH="$JAVA_HOME/bin:$PATH"
        if [ -f "/home/build/.apexpack-truststore.p12" ]; then
          export MAVEN_OPTS="${MAVEN_OPTS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
        fi
        MVN_SETTINGS=""
        if [ -f "/home/build/.m2/settings.xml" ]; then MVN_SETTINGS="-s /home/build/.m2/settings.xml"; fi
        mvn package -DskipTests -B -q -Dquarkus.package.jar.type=uber-jar $MVN_SETTINGS ${MAVEN_EXTRA_ARGS:-}
        mkdir -p ${{targets.destdir}}/app
        cp target/*-runner.jar ${{targets.destdir}}/app/app.jar
    spring-boot-gradle:
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d -print -quit 2>/dev/null)
        export PATH="$JAVA_HOME/bin:$PATH"
        echo "→ distributionUrl after rewrite:"
        grep "^distributionUrl=" gradle/wrapper/gradle-wrapper.properties || echo "  (not found)"
        DIST_URL=$(grep "^distributionUrl=" gradle/wrapper/gradle-wrapper.properties | sed 's/distributionUrl=//' | sed 's/\\:/:/g')
        echo "→ curl connectivity test to distribution URL:"
        curl --connect-timeout 10 -sI "$DIST_URL" 2>&1 | head -5; true
        chmod +x ./gradlew
        ./gradlew build -x test --no-daemon -q
        mkdir -p ${{targets.destdir}}/app
        JAR=$(find build/libs -name "*.jar" ! -name "*-plain.jar" -print -quit)
        [ -n "$JAR" ] || { echo "ERROR: no bootJar found in build/libs" >&2; exit 1; }
        cp "$JAR" ${{targets.destdir}}/app/app.jar
      caches:
        - /home/build/.gradle
    quarkus-gradle:
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d -print -quit 2>/dev/null)
        export PATH="$JAVA_HOME/bin:$PATH"
        if [ -f "/home/build/.apexpack-truststore.p12" ]; then
          export GRADLE_OPTS="${GRADLE_OPTS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
        fi
        chmod +x ./gradlew
        ./gradlew build -Dquarkus.package.jar.type=uber-jar -x test --no-daemon -q
        mkdir -p ${{targets.destdir}}/app
        cp build/quarkus-app/*-runner.jar ${{targets.destdir}}/app/app.jar
      caches:
        - /home/build/.gradle
    micronaut-gradle:
      command: |
        [ -d "$JAVA_HOME" ] || JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-*-openjdk" -type d -print -quit 2>/dev/null)
        export PATH="$JAVA_HOME/bin:$PATH"
        if [ -f "/home/build/.apexpack-truststore.p12" ]; then
          export GRADLE_OPTS="${GRADLE_OPTS} -Djavax.net.ssl.trustStore=/home/build/.apexpack-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
        fi
        chmod +x ./gradlew
        ./gradlew build -x test --no-daemon -q
        mkdir -p ${{targets.destdir}}/app
        cp build/libs/*.jar ${{targets.destdir}}/app/app.jar
      caches:
        - /home/build/.gradle

image:
  # JRE only — not JDK. No compiler in the final image reduces attack surface.
  packages:
    - openjdk-{JAVA_VERSION}-jre
    - ca-certificates-bundle=20260413-r0
  distro:
    alpine:
      packages:
        - alpine-release
        - openjdk{JAVA_VERSION}-jre
        - ca-certificates
  # java -jar is the entrypoint. The JAR path is passed via cmd.
  entrypoint: java
  cmd:
    - "-jar"
    - "/app/app.jar"
  run-as: 65532
  ports:
    - "8080"
  env:
    JAVA_HOME: "/usr/lib/jvm/java-{JAVA_VERSION}-openjdk"
    # Container-aware heap sizing only. This is JVM tuning, so a chart that sets
    # JAVA_TOOL_OPTIONS itself deliberately takes ownership of it; the truststore
    # apexpack bakes in lives in JDK_JAVA_OPTIONS instead, where a pod-spec env
    # entry cannot erase it. Do not add -Xint or -XX:-TieredCompilation here: both
    # cost roughly an order of magnitude of throughput, and neither avoids needing
    # executable memory, which is what "Failed to mark memory page as executable"
    # is actually about - the template interpreter is generated code too.
    JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    MALLOC_ARENA_MAX: "2"
  health-check:
    http:
      port: 8080
    interval: 30s
    timeout: 10s
    start-period: 60s
    retries: 3

scan:
  auto-patch: true
  patch-persist: false

test:
  packages:
    - busybox
    - openjdk-{JAVA_VERSION}-jre
  distro:
    alpine:
      packages:
        - busybox
        - openjdk{JAVA_VERSION}-jre
  pipeline:
    - runs: |
        set -e

        # Mirrors image.env JAVA_TOOL_OPTIONS. melange runs this test in the build
        # sandbox, not under the apko image environment, so the shipped value cannot
        # be read back here - it is repeated so the flags are at least proven to
        # start a JVM. Change both together.
        APEXPACK_JVM_OPTS="-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

        test -s /app/app.jar || { echo "ERROR: /app/app.jar not found or empty" >&2; exit 1; }

        # A jar with no Main-Class cannot be started by "java -jar" at all: the
        # container exits at once with "no main manifest attribute". A build that
        # packaged a library module rather than the application produces exactly
        # that, and it is far cheaper to catch here than from a CrashLoopBackOff.
        # Spring Boot jars name the loader as Main-Class, so they pass.
        if command -v unzip > /dev/null 2>&1; then
          MANIFEST=$(unzip -p /app/app.jar META-INF/MANIFEST.MF 2>/dev/null || true)
          if ! printf '%s' "$MANIFEST" | grep -qi "^Main-Class:"; then
            echo "ERROR: /app/app.jar declares no Main-Class - java -jar cannot start it" >&2
            echo "  MANIFEST.MF held:" >&2
            printf '%s\n' "$MANIFEST" | sed 's/^/    /' >&2
            exit 1
          fi
          echo "    manifest declares $(printf '%s' "$MANIFEST" | grep -i '^Main-Class:' | tr -d '\r')"
        fi

        JAVA_BIN=$(find /usr/lib/jvm -name java -type f -print -quit 2>/dev/null)
        if [ -z "$JAVA_BIN" ]; then JAVA_BIN=$(command -v java 2>/dev/null); fi
        if [ -z "$JAVA_BIN" ]; then echo "ERROR: java binary not found" >&2; exit 1; fi

        # The JVM's exit status is the whole point of this check, so it must not be
        # piped. "java -version | { head -2; cat >/dev/null; }" reports the status of
        # the trailing command, which is always 0 - so a VM that died during
        # initialisation passed this test. That is precisely the class of failure
        # worth catching: a bad option, a missing shared library, or
        # "Failed to mark memory page as executable".
        if ! "$JAVA_BIN" -version > /tmp/apexpack-javaver.txt 2>&1; then
          echo "ERROR: the JVM failed to start. Its output was:" >&2
          sed 's/^/    /' /tmp/apexpack-javaver.txt >&2
          exit 1
        fi
        sed 's/^/    /' /tmp/apexpack-javaver.txt

        # Start a JVM under exactly the options the image sets. JAVA_TOOL_OPTIONS is
        # applied before any application code runs, so an option this JVM does not
        # recognise kills every container before it reaches main().
        if ! JAVA_TOOL_OPTIONS="$APEXPACK_JVM_OPTS" "$JAVA_BIN" -version \
             > /tmp/apexpack-javaopts.txt 2>&1; then
          echo "ERROR: the JVM rejected the options this image ships:" >&2
          echo "    JAVA_TOOL_OPTIONS=$APEXPACK_JVM_OPTS" >&2
          sed 's/^/    /' /tmp/apexpack-javaopts.txt >&2
          exit 1
        fi
        if ! grep -q "Picked up JAVA_TOOL_OPTIONS" /tmp/apexpack-javaopts.txt; then
          echo "ERROR: the JVM did not pick up JAVA_TOOL_OPTIONS at all" >&2
          sed 's/^/    /' /tmp/apexpack-javaopts.txt >&2
          exit 1
        fi

        # -Xint leaves the JVM interpreting every bytecode. It is a debugging aid, not
        # a deployment setting, and it does not avoid needing executable memory.
        if grep -q "interpreted mode" /tmp/apexpack-javaopts.txt; then
          echo "ERROR: the shipped options leave the JVM in interpreted mode (-Xint)" >&2
          sed 's/^/    /' /tmp/apexpack-javaopts.txt >&2
          exit 1
        fi
        echo "    JVM starts under the shipped options, JIT enabled"

        # When a corporate CA was baked in, the truststore has to be a keystore the JVM
        # can actually open. A truncated or wrongly-typed file fails only on the first
        # outbound TLS call, deep inside the application.
        if [ -f /etc/ssl/certs/cacerts ]; then
          if ! JDK_JAVA_OPTIONS="-Djavax.net.ssl.trustStore=/etc/ssl/certs/cacerts -Djavax.net.ssl.trustStorePassword=changeit" \
               "$JAVA_BIN" -version > /tmp/apexpack-ts.txt 2>&1; then
            echo "ERROR: the JVM could not load the baked truststore /etc/ssl/certs/cacerts" >&2
            sed 's/^/    /' /tmp/apexpack-ts.txt >&2
            exit 1
          fi
          echo "    truststore /etc/ssl/certs/cacerts loads"
        fi

        # The entrypoint wrapper sits in front of the JVM in every image that needs a
        # runtime CA, so it has to stay transparent to the environment. If it ever
        # stopped exec-ing the real command, or dropped a variable on the way through,
        # the symptom in the cluster is a JVM that never reports its JAVA_TOOL_OPTIONS
        # and an application that cannot see its own configuration.
        if [ -x /usr/bin/apexpack-entrypoint ]; then
          GOT=$(APEXPACK_PROBE=transparent /usr/bin/apexpack-entrypoint \
                  sh -c 'printf %s "$APEXPACK_PROBE"' 2>/dev/null || true)
          if [ "$GOT" != "transparent" ]; then
            echo "ERROR: /usr/bin/apexpack-entrypoint did not pass the environment through" >&2
            echo "  expected 'transparent', got '$GOT'" >&2
            exit 1
          fi
          echo "    apexpack-entrypoint passes the environment through"
        fi

        echo "✓ /app/app.jar is startable and the JVM runs with the shipped options"
