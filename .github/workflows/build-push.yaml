# Reusable workflow — call this from any project repo that uses apexpack.
#
# The calling project must have build/melange.yaml and build/apko.yaml committed.
# Generate them once locally with: apexpacks build . --dry-run
#
# Example caller (.github/workflows/build.yaml in your project repo):
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#     workflow_dispatch:
#
#   jobs:
#     build:
#       uses: <your-org>/apexpack/.github/workflows/build-push.yaml@main
#       secrets: inherit
#
# Required secrets (set at org or repo level):
#   ARTIFACTORY_REGISTRY    — Artifactory Docker registry host  (e.g. registry.corp.com)
#   ARTIFACTORY_USER        — Artifactory username
#   ARTIFACTORY_PASSWORD    — Artifactory token / password

name: Build and Push Image

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        description: "Pushed image digest (sha256:...)"
        value: ${{ jobs.build-push.outputs.digest }}
      image:
        description: "Pushed image ref (registry/repo:tag)"
        value: ${{ jobs.build-push.outputs.image }}
    secrets:
      ARTIFACTORY_USER:
        required: true
      ARTIFACTORY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Install build tools ─────────────────────────────────────────────────
      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@main

      # ── Signing key ─────────────────────────────────────────────────────────
      - name: Generate ephemeral signing key
        run: melange keygen melange.rsa

      # ── Build APK packages ──────────────────────────────────────────────────
      - name: Build APK with melange
        uses: chainguard-dev/actions/melange-build-pkg@main
        with:
          config: build/melange.yaml
          signing-key-path: ${{ github.workspace }}/melange.rsa
          repository-path: ${{ github.workspace }}/packages
          archs: x86_64,aarch64
          source-dir: ${{ github.workspace }}
          package-version-tag: ${{ github.ref_name }}

      - name: Sign APKINDEX
        run: |
          for arch in x86_64 aarch64; do
            melange sign-index \
              --signing-key melange.rsa \
              "packages/${arch}/APKINDEX.tar.gz"
          done

      # ── Push image ──────────────────────────────────────────────────────────
      # wolfi-act runs inside a Wolfi container with apko pre-installed.
      # Workspace is mounted — melange.rsa.pub, packages/, and build/ are accessible.
      # Image name is derived from the repository name. Both versioned and :latest are pushed.
      - name: Build and push OCI image
        id: build
        uses: wolfi-dev/wolfi-act@main
        env:
          REGISTRY: ${{ vars.ARTIFACTORY_REGISTRY }}
          REGISTRY_USER: ${{ secrets.ARTIFACTORY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        with:
          packages: apko
          command: |
            set -ex
            echo "${REGISTRY_PASSWORD}" | apko login "${REGISTRY}" \
              -u "${REGISTRY_USER}" --password-stdin

            IMAGE="${REGISTRY}/${REPO}"

            DIGEST=$(apko publish build/apko.yaml \
              "${IMAGE}:${TAG}" \
              "${IMAGE}:latest" \
              --keyring-append melange.rsa.pub \
              --repository-append packages \
              --arch x86_64,aarch64 \
              --sbom-path sbom \
              2>/dev/null | tail -1)

            echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
            echo "image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT
