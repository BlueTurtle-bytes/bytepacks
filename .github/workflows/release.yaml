name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── 1. Publish CLI binaries via GoReleaser ──────────────────────────────────
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build and push the OCI image ─────────────────────────────────────────
  # Reuses the shared build-push workflow: melange → apko publish → ghcr.io
  publish:
    needs: goreleaser
    permissions:
      packages: write
    uses: ./.github/workflows/build-push.yaml
    secrets:
      ARTIFACTORY_USER: ${{ github.actor }}
      ARTIFACTORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Sign image and pin digest in Tekton tasks ────────────────────────────
  sign:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}"

      - name: Update Tekton task image references
        run: |
          NEW_REF="ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}"
          for task_file in tekton/tasks/*.yaml; do
            sed -i "s|image: ghcr.io/${{ github.repository }}[^ ]*|image: $NEW_REF|g" "$task_file"
          done
          grep -h "image: ghcr.io" tekton/tasks/*.yaml

      - name: Commit updated Tekton task YAML
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update apexpack image to ${{ github.sha }}"
          file_pattern: "tekton/tasks/*.yaml"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
