name: Release

on:
  tags:
    - "v*.*.*"

permissions:
  contents: write          # to commit updated Tekton task YAML back to main
  packages: write          # to push OCI image to ghcr.io
  id-token: write          # for cosign keyless signing

jobs:
  # ── 1. Publish CLI binaries via GoReleaser ──────────────────────────────────
  # Produces linux/darwin × amd64/arm64 tarballs + checksums, attaches them
  # to the GitHub Release, and updates the Homebrew tap if configured.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build and publish the OCI image ─────────────────────────────────────
  # Uses melange + apko directly (no apexpacks bootstrap):
  #   melange  →  builds the apexpacks APK for amd64 + arm64
  #   apko     →  assembles and pushes the multi-arch OCI image to ghcr.io
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Install build tools ─────────────────────────────────────────────────
      - name: Install melange
        uses: chainguard-dev/actions/setup-melange@main

      - name: Install apko
        uses: chainguard-dev/actions/setup-apko@main

      # ── Signing key ─────────────────────────────────────────────────────────
      - name: Generate melange signing key
        run: melange keygen /tmp/apexpack-signing.rsa

      # ── Version ─────────────────────────────────────────────────────────────
      # Strip the leading "v" from the tag (v1.2.3 → 1.2.3) for the APK version.
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # ── Build APK packages ──────────────────────────────────────────────────
      # Produces packages/amd64/*.apk and packages/arm64/*.apk under /tmp/packages.
      - name: Build APK packages with melange
        run: |
          melange build build/melange.yaml \
            --arch amd64,arm64 \
            --signing-key /tmp/apexpack-signing.rsa \
            --out-dir /tmp/packages \
            --source-dir . \
            --override version=${{ steps.version.outputs.version }}

      # ── Push image ──────────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apko login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build and push OCI image with apko
        id: build
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="${{ github.ref_name }}"

          # apko publish prints the digest as the last line of stdout
          DIGEST=$(apko publish build/apko.yaml \
            "${IMAGE}:${TAG}" \
            "${IMAGE}:latest" \
            --keyring-append /tmp/apexpack-signing.rsa.pub \
            --repository-append /tmp/packages \
            --arch amd64,arm64 \
            2>/dev/null | tail -1)

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT

      # ── Sign ────────────────────────────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      # ── Pin digest in Tekton tasks ──────────────────────────────────────────
      # Replaces any existing apexpack image reference with the exact digest so
      # ArgoCD/Flux knows which image version the cluster should run.
      - name: Update Tekton task image references
        run: |
          NEW_REF="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          for task_file in tekton/tasks/*.yaml; do
            sed -i "s|image: ghcr.io/${{ github.repository }}[^ ]*|image: $NEW_REF|g" "$task_file"
          done
          echo "Updated task files:"
          grep -h "image: ghcr.io" tekton/tasks/*.yaml

      - name: Commit updated Tekton task YAML
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update apexpack image to ${{ github.sha }}"
          file_pattern: "tekton/tasks/*.yaml"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
