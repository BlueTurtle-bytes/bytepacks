# Verifies that apexpack can build a real OCI image for every supported
# language and version combination. Runs on push to main and on PRs
# targeting main. Badge JSON in the Gist is updated only on push to main.
#
# Required secrets (set at repo level):
#   GIST_TOKEN       — GitHub PAT with the `gist` scope
#   GIST_ID          — ID of the Gist that holds the badge JSON files
#   ARTI_USER        — Artifactory username
#   ARTI_PASSWORD    — Artifactory password
#
# Optional:
#   Update the CORP_CA_CERT_URL placeholder in the "Fetch corporate CA cert" step
#
# To initialise the Gist, create one file per badge key listed in the
# matrix below (e.g. java_17.json) with this starter content:
#   {"schemaVersion":1,"label":"java 17","message":"pending","color":"lightgrey"}
#
# Add the placeholder repo URLs before enabling this workflow.

name: Language Version Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build the apexpacks binary once; all matrix jobs reuse it ──────────────
  prepare:
    name: Build apexpacks binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout apexpack
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build apexpacks
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: apexpacks-binary
          path: bin/apexpacks
          retention-days: 1

  # ── Per-language/version matrix — runs in parallel after prepare ───────────
  build:
    name: ${{ matrix.runtime }} ${{ matrix.version }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Java ───────────────────────────────────────────────────────────
          - runtime: java
            version: "17"
            repo: https://github.com/PLACEHOLDER/sample-java-17
            badge: java_17

          - runtime: java
            version: "21"
            repo: https://github.com/PLACEHOLDER/sample-java-21
            badge: java_21

          # ── Node ───────────────────────────────────────────────────────────
          - runtime: node
            version: "18"
            repo: https://github.com/PLACEHOLDER/sample-node-18
            badge: node_18

          - runtime: node
            version: "20"
            repo: https://github.com/PLACEHOLDER/sample-node-20
            badge: node_20

          - runtime: node
            version: "22"
            repo: https://github.com/PLACEHOLDER/sample-node-22
            badge: node_22

          # ── Python ─────────────────────────────────────────────────────────
          - runtime: python
            version: "3.11"
            repo: https://github.com/PLACEHOLDER/sample-python-311
            badge: python_311

          - runtime: python
            version: "3.12"
            repo: https://github.com/PLACEHOLDER/sample-python-312
            badge: python_312

          # ── .NET ───────────────────────────────────────────────────────────
          - runtime: dotnet
            version: "8"
            repo: https://github.com/PLACEHOLDER/sample-dotnet-8
            badge: dotnet_8

          - runtime: dotnet
            version: "9"
            repo: https://github.com/PLACEHOLDER/sample-dotnet-9
            badge: dotnet_9

          # ── Go ─────────────────────────────────────────────────────────────
          - runtime: golang
            version: "1.22"
            repo: https://github.com/PLACEHOLDER/sample-go-122
            badge: go_122

          - runtime: golang
            version: "1.23"
            repo: https://github.com/PLACEHOLDER/sample-go-123
            badge: go_123

    steps:
      - name: Checkout apexpack
        uses: actions/checkout@v4

      - name: Download apexpacks binary
        uses: actions/download-artifact@v4
        with:
          name: apexpacks-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/apexpacks

      - name: Install melange and apko
        run: |
          MELANGE_VER=$(curl -sf https://api.github.com/repos/chainguard-dev/melange/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/chainguard-dev/melange/releases/download/${MELANGE_VER}/melange_linux_amd64.tar.gz" \
            | tar -xz -C /tmp melange
          sudo mv /tmp/melange /usr/local/bin/melange

          APKO_VER=$(curl -sf https://api.github.com/repos/chainguard-dev/apko/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/chainguard-dev/apko/releases/download/${APKO_VER}/apko_linux_amd64.tar.gz" \
            | tar -xz -C /tmp apko
          sudo mv /tmp/apko /usr/local/bin/apko

      - name: Fetch corporate CA cert
        env:
          CORP_CA_CERT_URL: ${{ secrets.CORP_CA_CERT_URL }}
        run: |
          if [ -z "$CORP_CA_CERT_URL" ]; then
            echo "CORP_CA_CERT_URL not set — skipping"
            exit 0
          fi
          BASENAME=$(basename "$CORP_CA_CERT_URL")
          DEST="/tmp/corp-cert/${BASENAME%.tar}"
          mkdir -p "$DEST"
          curl -Lk "$CORP_CA_CERT_URL" | tar -xf - -C "$DEST"
          BUNDLE="/tmp/corp-ca-bundle.pem"
          find "$DEST" -maxdepth 2 \( -name "*.pem" -o -name "*.crt" \) | sort | xargs cat > "$BUNDLE"
          COUNT=$(grep -c "BEGIN CERTIFICATE" "$BUNDLE" || true)
          echo "APEXPACK_EXTRA_CA=$BUNDLE" >> $GITHUB_ENV
          echo "→ CA bundle: $COUNT cert(s) written to $BUNDLE"

      - name: Clone test repo
        run: git clone --depth 1 ${{ matrix.repo }} /home/runner/_work/testrepo

      - name: Build image (local, no push)
        id: apexbuild
        env:
          # melange --runner docker bind-mounts its workspace into DinD.
          # DinD shares /home/runner/_work with the runner container via the
          # "work" volume, so workspace paths under that directory are visible
          # to the Docker daemon. /tmp is runner-only and causes a bind-mount
          # "source path does not exist" error.
          TMPDIR: ${{ github.workspace }}
          # Artifactory credentials — injected into melange.yaml environment block
          # by the language hooks (hook_java.go, hook_dotnet.go) via os.Getenv.
          # Never stored in profile YAML; sourced from the regcred-equivalent secret.
          ARTI_USER: ${{ secrets.ARTI_USER }}
          ARTI_PASSWORD: ${{ secrets.ARTI_PASSWORD }}
        run: |
          ./bin/apexpacks build /home/runner/_work/testrepo \
            --runtime ${{ matrix.runtime }} \
            --tag apexpack-ci/${{ matrix.runtime }}-${{ matrix.version }}:test \
            --local \
            --melange-runner docker
        continue-on-error: true

      # Badge update only runs on push to main so that fork PRs (which have no
      # secret access) do not fail at this step.
      - name: Update badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ "${{ steps.apexbuild.outcome }}" = "success" ]; then
            MESSAGE="passing"
            COLOR="brightgreen"
          else
            MESSAGE="failing"
            COLOR="red"
          fi

          BADGE_JSON=$(jq -cn \
            --arg label "${{ matrix.runtime }} ${{ matrix.version }}" \
            --arg message "$MESSAGE" \
            --arg color "$COLOR" \
            '{schemaVersion: 1, label: $label, message: $message, color: $color}')

          jq -cn \
            --arg fname "${{ matrix.badge }}.json" \
            --arg content "$BADGE_JSON" \
            '{files: {($fname): {content: $content}}}' \
          | curl -sf -X PATCH \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "https://api.github.com/gists/$GIST_ID"

      - name: Fail if build failed
        if: steps.apexbuild.outcome != 'success'
        run: exit 1
